dataset_general_params:
  real_synthetic: "rs"
  embedding: "bert"
  train_df: "dataset/GAB_dataset/real_users.tsv"
  all_posts_with_users_path: "dataset/GAB_dataset/real_and_synthetic_posts.tsv"
  aggr: "average"   # if value is "already" it means that they are already aggregated
  field_id: "account_id"
  field_post_id: "id"
  field_text: "content"
  field_label: "label"

train_dataset_params:
  train_social_net: "dataset/GAB_dataset/{}/train_network.edg"
  consider_content: True
  consider_rel: True
  separator: "\t"
  retrain: True

test_dataset_params:
  test_df: "dataset/GAB_dataset/{}/test.tsv"
  full_social_net: "dataset/GAB_dataset/{}/social_network_{}.edg"
  consider_content: True
  consider_rel: True
  separator: "\t"

model_params:
  out_channels: 6   # Number of classes to predict
  dir_models: "dataset/GAB_dataset/models_{}"
  epochs_rel: 30
  mlp_batch_size: 64
  mlp_lr: 2e-4
  softmax_lr: 4e-4
  ne_dim_rel: 768
  word_emb_size: 256
  w2v_epochs: 15
  loss: "weighted"
  use_ae: False
